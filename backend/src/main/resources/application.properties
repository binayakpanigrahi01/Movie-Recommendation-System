# Server
server.port=${PORT:8080}

# Import local properties if present (gitignored)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_recommender?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization — applies schema.sql then data.sql on every startup
# Use 'always' here so both the schema and seed data stay consistent between runs.
# Safe because every statement uses IF NOT EXISTS / ON DUPLICATE KEY UPDATE.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# JWT Configuration (24 hours expiration)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# TMDB API
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}

# OMDb API (Optional)
app.omdb.api-key=${OMDB_API_KEY:}
app.omdb.base-url=${OMDB_BASE_URL:https://www.omdbapi.com}

# Groq API
app.groq.api-key=${GROQ_API_KEY:}
app.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Brevo SMTP Mail
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Frontend URL used to build the password-reset link sent by email
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
